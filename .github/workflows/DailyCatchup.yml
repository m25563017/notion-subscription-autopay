name: Notion 訂閱自動補帳

on:
  schedule:
    - cron: "17 1 * * *" # UTC 01:17 = 台北 09:17，每天跑一次（避開整點壅塞）
  workflow_dispatch: {}

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run catchup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SUBS_DB_ID: ${{ secrets.NOTION_SUBS_DB_ID }}
          NOTION_PAYMENTS_DB_ID: ${{ secrets.NOTION_PAYMENTS_DB_ID }}
