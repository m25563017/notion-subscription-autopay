name: 訂閱狀況月報 Email

on:
    schedule:
        - cron: "12 22 10 * *" # UTC 每月 10 號 22:12 = 台北 每月 11 號 06:12
    workflow_dispatch: {}

jobs:
    send-email:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm install
            - run: npm run monthly-email
              env:
                  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
                  NOTION_SUBS_DB_ID: ${{ secrets.NOTION_SUBS_DB_ID }}
                  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
                  MAIL_TO: ${{ secrets.MAIL_TO }}
                  MAIL_FROM: ${{ secrets.MAIL_FROM }}
